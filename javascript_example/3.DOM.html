<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM 실습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #1b2130;
  --muted: #5c6779;
  --line: #d5dbe5;
  --guide: #e3e8ef;
  --accent: #3b5bdb;
  --sel: #e8590c;
  --match: #7048e8;
  --add: #2f9e44;
  --chg: #f08c00;
  --del: #e03131;

  --code-bg: #1f2433;
  --code-bg-2: #272d3f;
  --code-line: #363d52;
  --code-ink: #d6dbe6;
  --code-dim: #7d869a;

  /* Chrome 개발자 도구와 같은 계열의 색 — 나중에 실제 도구로 넘어갈 때 익숙하도록 */
  --t-tag: #881280;
  --t-attr: #994500;
  --t-val: #1a1aa6;
  --t-text: #303942;

  --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'D2Coding', Consolas, 'Courier New', monospace;
  --lab-h: 320px;
}

html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) 8px var(--lab-h);
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
code, kbd { font-family: var(--mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 상단 바 ── */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--muted); }

.selector-lab {
  flex: 1; display: flex; align-items: center; gap: 8px;
  max-width: 720px; margin-left: auto;
}
.selector-lab label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.selector-lab input {
  flex: 1; min-width: 120px;
  font-family: var(--mono); font-size: 13px;
  padding: 7px 10px;
  border: 1.5px solid var(--line); border-radius: 6px;
  background: var(--surface-2);
}
.selector-lab input:focus { outline: none; border-color: var(--match); background: #fff; }
.sel-status { font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 84px; }
.sel-status.ok { color: var(--match); font-weight: 600; }
.sel-status.bad { color: var(--del); }

.btn-quiet {
  padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.btn-quiet:hover:not(:disabled) { background: var(--surface-2); }
.btn-quiet:disabled { opacity: 0.45; cursor: default; }
.btn-quiet.dark { background: transparent; border-color: var(--code-line); color: var(--code-dim); }
.btn-quiet.dark:hover { color: var(--code-ink); background: var(--code-bg-2); }

.btn-reset {
  padding: 7px 14px; border-radius: 6px;
  border: 1.5px solid #f1c0c0; background: #fff5f5; color: #c92a2a;
  font-weight: 600; font-size: 13px; cursor: pointer;
}
.btn-reset:hover { background: #ffe3e3; }

/* ── 위쪽 작업 영역 ── */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1px; background: var(--line);
  min-height: 0;
}
.pane { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.pane-head h2 { margin: 0; font-size: 13.5px; font-weight: 700; }
.pane-head h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.hint code { color: var(--sel); font-weight: 600; }

.stage { position: relative; flex: 1; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
body.dragging .stage iframe { pointer-events: none; }

.ov { position: absolute; border-radius: 3px; }
.ov-hover    { background: rgba(59, 91, 219, 0.16); box-shadow: inset 0 0 0 1.5px rgba(59, 91, 219, 0.7); }
.ov-match    { background: rgba(112, 72, 232, 0.10); box-shadow: inset 0 0 0 2px var(--match); }
.ov-selected { box-shadow: inset 0 0 0 2.5px var(--sel), 0 0 0 3px rgba(232, 89, 12, 0.18); }
.ov-flash-added   { animation: ovAdd 1.8s ease-out forwards; }
.ov-flash-changed { animation: ovChg 1.8s ease-out forwards; }
.ov-flash-lost    { animation: ovDel 1.8s ease-out forwards; }
@keyframes ovAdd { from { background: rgba(47, 158, 68, 0.35); box-shadow: inset 0 0 0 2px var(--add); } to { background: transparent; box-shadow: none; } }
@keyframes ovChg { from { background: rgba(240, 140, 0, 0.30); box-shadow: inset 0 0 0 2px var(--chg); } to { background: transparent; box-shadow: none; } }
@keyframes ovDel { from { box-shadow: inset 0 0 0 2px var(--del); } to { box-shadow: none; } }

.ov-label {
  position: absolute; left: -2px; top: -20px;
  font-family: var(--mono); font-size: 11px; line-height: 1;
  padding: 3px 6px; border-radius: 3px; white-space: nowrap;
  color: #fff;
}
.ov-hover .ov-label { background: var(--accent); }
.ov-selected .ov-label { background: var(--sel); }
.ov-label.below { top: auto; bottom: -20px; }

/* ── DOM 트리 ── */
.tree {
  flex: 1; min-height: 0; overflow: auto;
  padding: 8px 0 16px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
}
.row {
  --d: 0;
  position: relative;
  padding: 0 14px 0 calc(14px + var(--d) * 18px);
  white-space: nowrap; cursor: pointer;
  background-image: repeating-linear-gradient(to right, var(--guide) 0 1px, transparent 1px 18px);
  background-size: calc(var(--d) * 18px) 100%;
  background-position: 18px 0;
  background-repeat: no-repeat;
  border-left: 3px solid transparent;
}
.row:hover, .row.is-hover { background-color: #edf2ff; }
.row.is-match { border-left-color: var(--match); background-color: #f3f0ff; }
.row.is-selected { background-color: #fff4e6; border-left-color: var(--sel); }
.row.is-selected::after {
  content: '= $0'; color: var(--sel); font-weight: 600; margin-left: 10px; font-size: 11.5px;
}
.row.fl-added   { animation: rowAdd 1.8s ease-out; }
.row.fl-changed { animation: rowChg 1.8s ease-out; }
.row.fl-lost    { animation: rowDel 1.8s ease-out; }
@keyframes rowAdd { from { background-color: #b2f2bb; } }
@keyframes rowChg { from { background-color: #ffe8a3; } }
@keyframes rowDel { from { background-color: #ffc9c9; } }

.t-br   { color: var(--t-tag); }
.t-tag  { color: var(--t-tag); }
.t-an   { color: var(--t-attr); }
.t-av   { color: var(--t-val); }
.t-txt  { color: var(--t-text); }
.t-node { color: var(--muted); }
.t-blank { color: #a3acba; font-style: italic; font-family: var(--sans); font-size: 12px; }

/* 선택된 요소 정보 */
.inspect {
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  padding: 9px 14px 10px;
  font-size: 12.5px;
  min-height: 74px;
}
.inspect .empty { color: var(--muted); }
.inspect .empty code { color: var(--sel); font-weight: 600; }
.ins-grid { display: grid; grid-template-columns: max-content 1fr max-content 1fr; gap: 3px 12px; align-items: baseline; }
.ins-grid dt { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.ins-grid dd { margin: 0; font-family: var(--mono); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ins-title { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-family: var(--mono); font-size: 12.5px; }
.ins-title .dollar { color: var(--sel); font-weight: 600; }

/* ── 리사이저 ── */
.resizer {
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--code-line);
  cursor: row-resize; position: relative;
}
.resizer::after {
  content: ''; position: absolute; left: 50%; top: 2px; width: 40px; height: 3px;
  margin-left: -20px; border-radius: 2px; background: var(--line);
}
.resizer:hover::after, body.dragging .resizer::after { background: var(--accent); }

/* ── 아래 실습 영역 ── */
.lab {
  display: grid;
  grid-template-columns: 236px minmax(0, 1.1fr) minmax(0, 1fr);
  min-height: 0;
  background: var(--code-bg);
  color: var(--code-ink);
}
.lessons {
  overflow-y: auto; padding: 8px 0 14px;
  background: #1a1e2b;
  border-right: 1px solid var(--code-line);
}
.lesson-group { margin-top: 8px; }
.lesson-group h3 {
  margin: 0; padding: 4px 16px;
  font-size: 12px; font-weight: 600; color: #9aa3b8;
}
.lesson-group h3 span { color: #5d667c; font-weight: 400; margin-right: 4px; }
.lesson-btn {
  display: block; width: 100%; text-align: left;
  padding: 4px 16px 4px 28px;
  background: none; border: 0; border-left: 2px solid transparent;
  font-family: var(--mono); font-size: 12.5px; color: var(--code-ink);
  cursor: pointer;
}
.lesson-btn:hover { background: var(--code-bg-2); }
.lesson-btn.active { background: #2b3350; border-left-color: #748ffc; color: #fff; }

.editor-wrap { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--code-line); }
.lesson-info {
  padding: 10px 16px 10px;
  border-bottom: 1px solid var(--code-line);
  font-size: 13px; line-height: 1.6;
  max-height: 45%; overflow-y: auto;
}
.lesson-info h4 { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: #fff; }
.lesson-info p { margin: 0; color: #c3c9d6; }
.lesson-info code { background: #2f3650; color: #ffd8a8; padding: 0 4px; border-radius: 3px; }
.lesson-info .try {
  margin-top: 6px; color: #b2f2bb;
}
.lesson-info .try::before { content: '바꿔 보기 '; font-weight: 700; color: #8ce99a; }

textarea#code {
  flex: 1; min-height: 60px; resize: none;
  background: var(--code-bg); color: var(--code-ink);
  border: 0; outline: none;
  padding: 12px 16px;
  font-family: var(--mono); font-size: 13.5px; line-height: 1.7;
  tab-size: 2;
}
textarea#code:focus-visible { box-shadow: inset 0 0 0 2px #4c6ef5; }
.run-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-top: 1px solid var(--code-line);
  background: #1a1e2b;
}
.btn-run {
  padding: 6px 18px; border: 0; border-radius: 6px;
  background: #4c6ef5; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
}
.btn-run:hover { background: #5c7cfa; }
.kbd-hint { font-size: 12px; color: var(--code-dim); white-space: nowrap; }
kbd { border: 1px solid var(--code-line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; }
.run-note { font-size: 12px; color: var(--code-dim); margin-left: auto; text-align: right; }

.console-wrap { display: flex; flex-direction: column; min-height: 0; }
.console-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px 6px 16px; border-bottom: 1px solid var(--code-line);
}
.console-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: #c3c9d6; }
.console { flex: 1; overflow-y: auto; padding: 6px 0 12px; font-family: var(--mono); font-size: 12.5px; }

.entry { padding: 5px 16px; border-bottom: 1px solid #2a3044; }
.entry pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.e-echo { color: var(--code-dim); }
.e-echo pre { padding-left: 14px; position: relative; }
.e-echo pre::before { content: '›'; position: absolute; left: 0; color: #748ffc; }
.e-result::before { content: '← '; color: var(--code-dim); }
.e-log::before   { content: 'log '; color: var(--code-dim); font-size: 11px; }
.e-warn { background: #3a3220; color: #ffe066; }
.e-error { background: #3b2328; color: #ffa8a8; }
.e-error .hint-line { display: block; color: #ffd8a8; font-family: var(--sans); font-size: 12.5px; margin-top: 3px; }
.e-info { color: #a5d8ff; font-family: var(--sans); font-size: 12.5px; }
.e-sys { color: var(--code-dim); font-family: var(--sans); font-size: 12px; text-align: center; }
.e-diff { font-family: var(--sans); font-size: 12.5px; color: #c3c9d6; }
.e-diff .none { color: var(--code-dim); }
.diff-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 1px 0; }
.diff-tag { font-weight: 700; font-size: 12px; min-width: 64px; }
.diff-tag.add { color: #8ce99a; }
.diff-tag.del { color: #ffa8a8; }
.diff-tag.chg { color: #ffd43b; }
.diff-attr { font-family: var(--mono); font-size: 11.5px; color: var(--code-dim); }

.v-str  { color: #ffd8a8; }
.v-num  { color: #b197fc; }
.v-null, .v-undef { color: var(--code-dim); }
.v-fn   { color: #99e9f2; font-style: italic; }
.v-key  { color: #a5d8ff; }
.v-type { color: #c3c9d6; }

.chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0 7px; border-radius: 4px;
  background: #2f3650; border: 1px solid #434b66;
  color: #e599f7; cursor: pointer; font-family: var(--mono); font-size: 12px;
  line-height: 1.7;
}
.chip:hover { background: #3b4466; border-color: #748ffc; }
.chip .chip-text { color: var(--code-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.detached { opacity: 0.55; text-decoration: line-through; cursor: default; }
.chip.text-node { color: #c3c9d6; }

.list-head { cursor: pointer; color: #c3c9d6; }
.list-head:hover { color: #fff; text-decoration: underline dotted; }
.list-items { display: flex; flex-direction: column; gap: 3px; margin: 4px 0 0 14px; }
.list-items .idx { color: var(--code-dim); margin-right: 6px; display: inline-block; min-width: 1.5em; text-align: right; }

/* ── 좁은 화면 ── */
@media (max-width: 960px) {
  body { display: block; overflow: auto; }
  .topbar { flex-wrap: wrap; }
  .selector-lab { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
  .btn-reset { margin-left: auto; }
  .workspace { grid-template-columns: 1fr; }
  .pane-render .stage { height: 360px; flex: none; }
  .tree { max-height: 360px; }
  .resizer { display: none; }
  .lab { grid-template-columns: 1fr; }
  .lessons { max-height: 220px; }
  textarea#code { min-height: 180px; }
  .console-wrap { min-height: 260px; }
  .console { max-height: 320px; }
}
@media (prefers-reduced-motion: reduce) {
  .row.fl-added, .row.fl-changed, .row.fl-lost { animation-duration: 0.01s; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong>DOM 실습실</strong>
    <span>코드를 실행하면 화면과 트리가 함께 바뀌어요</span>
  </div>
  <div class="selector-lab">
    <label for="sel-input">선택자 실험</label>
    <input id="sel-input" spellcheck="false" autocomplete="off"
           placeholder="예: .post-item   #main-title   li[data-category=&quot;js&quot;]">
    <span id="sel-status" class="sel-status"></span>
    <button id="sel-send" class="btn-quiet" disabled>에디터로 보내기</button>
  </div>
  <button id="reset-btn" class="btn-reset" title="실습 페이지를 처음 상태로 되돌립니다. 연결한 이벤트도 사라져요.">초기화</button>
</header>

<main class="workspace">
  <section class="pane pane-render">
    <div class="pane-head">
      <h2>렌더링 화면</h2>
      <span class="hint">요소를 클릭하면 <code>$0</code>으로 선택돼요</span>
    </div>
    <div class="stage" id="stage">
      <iframe id="frame" title="실습용 블로그 페이지"></iframe>
      <div class="overlay" id="overlay"></div>
    </div>
  </section>

  <section class="pane pane-tree">
    <div class="pane-head">
      <h2>DOM 트리<small>&lt;body&gt; 아래</small></h2>
      <label class="hint"><input type="checkbox" id="text-toggle"> 텍스트 노드까지 보기</label>
    </div>
    <div class="tree" id="tree"></div>
    <div class="inspect" id="inspect"></div>
  </section>
</main>

<div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" aria-label="실습 영역 높이 조절"></div>

<section class="lab">
  <nav class="lessons" id="lessons" aria-label="예제 목록"></nav>

  <div class="editor-wrap">
    <div class="lesson-info" id="lesson-info"></div>
    <textarea id="code" spellcheck="false" aria-label="코드 입력"
              placeholder="// 여기에 코드를 쓰거나, 왼쪽 목록에서 예제를 고르세요"></textarea>
    <div class="run-bar">
      <button id="run-btn" class="btn-run">실행</button>
      <span class="kbd-hint"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd></span>
      <span class="run-note">실행할 때마다 새로 시작해요. 이전 실행의 변수는 이어지지 않아요.</span>
    </div>
  </div>

  <div class="console-wrap">
    <div class="console-head">
      <h2>결과</h2>
      <button id="clear-btn" class="btn-quiet dark">지우기</button>
    </div>
    <div class="console" id="console" aria-live="polite"></div>
  </div>
</section>

<script>
/* ════════════════════════════════════════════════════════════
   1. 실습용 페이지 (iframe 안에 들어가는 별도 문서)
   ════════════════════════════════════════════════════════════ */
const DEMO_STYLE = `
  body { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
         margin: 0; padding: 22px 18px 18px; color: #212529; background: #fff; font-size: 14px; line-height: 1.5; }
  #site-header { background: #2b3245; color: #fff; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; }
  #main-title { font-size: 20px; margin: 0 0 8px; }
  #site-nav { display: flex; gap: 6px; }
  .nav-link { color: #fff; text-decoration: none; padding: 3px 10px; border-radius: 4px;
              background: rgba(255,255,255,.12); font-size: 13px; }
  .nav-link.current { background: rgba(255,255,255,.32); }
  #post-section { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  #post-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .post-item { padding: 7px 10px; border: 1px solid #dee2e6; border-radius: 6px; cursor: pointer; }
  #post-form { display: flex; gap: 6px; }
  #post-input { flex: 1; padding: 6px 9px; border: 1px solid #ced4da; border-radius: 6px; font: inherit; }
  #add-btn { padding: 6px 14px; border: 0; border-radius: 6px; background: #3b5bdb; color: #fff; font: inherit; cursor: pointer; }

  /* 실습에서 classList로 붙였다 뗄 수 있게 미리 준비해 둔 클래스 */
  .highlight { background: #fff3bf; border-color: #fab005; }
  .important { color: #c92a2a; font-weight: 700; }
  .hidden    { display: none; }
`;

const DEMO_BODY = `
  <header id="site-header">
    <h1 id="main-title" class="title">나의 블로그</h1>
    <nav id="site-nav">
      <a href="#" class="nav-link" data-page="home">홈</a>
      <a href="#" class="nav-link current" data-page="posts">포스트</a>
    </nav>
  </header>

/* ════════════════════════════════════════════════════════════
   3. 상태
   ════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const frame = $('frame'), overlay = $('overlay'), treeEl = $('tree'), inspectEl = $('inspect');
const codeEl = $('code'), consoleEl = $('console');

let win = null, doc = null, observer = null;
let selected = null;          // 클릭해서 고른 요소 ($0)
let hovered = [];             // 마우스를 올린 요소들
let matches = [];             // 선택자 실험과 일치하는 요소들
let showText = false;         // 텍스트 노드 표시 여부
let rowMap = new Map();       // 노드 → 트리 행들
const marks = new Map();      // 노드 → { type: added|changed|lost, t }
const FLASH = 1800;
const VOID = new Set(['area','base','br','col','embed','hr','img','input','link','meta','source','track','wbr']);

/* ════════════════════════════════════════════════════════════
   4. iframe 준비
   ════════════════════════════════════════════════════════════ */
function loadFrame() {
  frame.srcdoc = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>${DEMO_STYLE}</style></head><body>${DEMO_BODY}</body></html>`;
}

frame.addEventListener('load', () => {
  win = frame.contentWindow;
  doc = frame.contentDocument;
  selected = null; hovered = []; marks.clear();
  win.$0 = undefined;

  // console.log 등을 결과 칸으로 가져오기
  ['log', 'info', 'warn', 'error'].forEach(kind => {
    const original = win.console[kind].bind(win.console);
    win.console[kind] = (...args) => { printLog(kind, args); original(...args); };
  });
  // 이벤트 핸들러 안에서 난 오류도 결과 칸에 표시
  win.addEventListener('error', e => printError(e.error || { message: e.message }, true));
  win.addEventListener('unhandledrejection', e => printError(e.reason, true));

  // 렌더링 화면: 클릭하면 선택, 링크 이동·폼 제출은 막기
  doc.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('a')) e.preventDefault();
    if (e.target.nodeType === 1) select(e.target);
  }, true);
  doc.addEventListener('submit', e => e.preventDefault(), true);
  doc.addEventListener('mouseover', e => { if (e.target.nodeType === 1) setHover([e.target]); });
  doc.documentElement.addEventListener('mouseleave', () => setHover([]));
  win.addEventListener('scroll', drawOverlays, { passive: true });

  // DOM이 바뀌면 트리를 자동으로 다시 그림 (이벤트로 바뀐 것도 포함)
  observer = new win.MutationObserver(records => { collect(records); scheduleRender(); });
  observer.observe(doc.body, { subtree: true, childList: true, attributes: true, characterData: true });

  renderAll();
});

/* ════════════════════════════════════════════════════════════
   5. 변경 감지
   ════════════════════════════════════════════════════════════ */
function mark(node, type) {
  if (!node || node.nodeType !== 1) return;
  const prev = marks.get(node);
  if (prev && prev.type === 'added' && type !== 'added') return; // 새로 생긴 요소는 계속 초록으로
  marks.set(node, { type, t: performance.now() });
}

function collect(records) {
  const s = { added: [], removed: [], text: new Set(), attrs: new Map() };
  for (const r of records) {
    if (r.type === 'childList') {
      r.addedNodes.forEach(n => {
        if (n.nodeType === 1) { s.added.push(n); mark(n, 'added'); }
        else if (n.nodeType === 3 && n.data.trim()) { s.text.add(r.target); mark(r.target, 'changed'); }
      });
      r.removedNodes.forEach(n => {
        if (n.nodeType === 1) { s.removed.push(n); mark(r.target, 'lost'); }
        else if (n.nodeType === 3 && n.data.trim()) { s.text.add(r.target); mark(r.target, 'changed'); }
      });
    } else if (r.type === 'attributes') {
      if (!s.attrs.has(r.target)) s.attrs.set(r.target, new Set());
      s.attrs.get(r.target).add(r.attributeName);
      mark(r.target, 'changed');
    } else if (r.type === 'characterData') {
      const p = r.target.parentElement;
      if (p) { s.text.add(p); mark(p, 'changed'); }
    }
  }
  return s;
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderAll(); });
}

function renderAll() {
  if (!doc) return;
  if (selected && !selected.isConnected) { selected = null; win.$0 = undefined; }
  hovered = hovered.filter(n => n.isConnected);
  updateMatches();
  renderTree();
  updateHighlights();
  renderInspect();
}

/* ════════════════════════════════════════════════════════════
   6. DOM 트리 그리기
   ════════════════════════════════════════════════════════════ */
function trunc(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function sp(cls, text) { const e = document.createElement('span'); e.className = cls; e.textContent = text; return e; }

function openTag(el, row) {
  row.append(sp('t-br', '<'), sp('t-tag', el.tagName.toLowerCase()));
  for (const a of el.attributes) {
    row.append(' ', sp('t-an', a.name));
    if (a.value !== '') row.append(sp('t-br', '="'), sp('t-av', trunc(a.value, 40)), sp('t-br', '"'));
  }
  row.append(sp('t-br', '>'));
}
function closeTag(el, row) {
  row.append(sp('t-br', '</'), sp('t-tag', el.tagName.toLowerCase()), sp('t-br', '>'));
}

function addRow(node, depth, frag) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.setProperty('--d', depth);
  const target = node.nodeType === 1 ? node : node.parentElement;
  row.addEventListener('mouseenter', () => setHover(target ? [target] : []));
  row.addEventListener('mouseleave', () => setHover([]));
  row.addEventListener('click', () => target && select(target, false));

  const m = marks.get(node);
  if (m) {
    const elapsed = performance.now() - m.t;
    if (elapsed < FLASH) {
      row.classList.add('fl-' + m.type);
      row.style.animationDelay = `-${elapsed}ms`;
    }
  }
  if (!rowMap.has(node)) rowMap.set(node, []);
  rowMap.get(node).push(row);
  frag.appendChild(row);
  return row;
}

function buildRows(node, depth, frag) {
  if (node.nodeType === 3) {
    if (!showText) return;
    const row = addRow(node, depth, frag);
    if (node.data.trim()) row.append(sp('t-node', '#text '), sp('t-txt', `"${trunc(node.data.trim(), 40)}"`));
    else row.append(sp('t-node', '#text '), sp('t-blank', '줄바꿈·공백'));
    return;
  }
  if (node.nodeType === 8) {
    if (showText) addRow(node, depth, frag).append(sp('t-node', `<!-- ${trunc(node.data.trim(), 30)} -->`));
    return;
  }
  if (node.nodeType !== 1) return;

  const tag = node.tagName.toLowerCase();
  const kids = showText ? [...node.childNodes] : [...node.children];
  const row = addRow(node, depth, frag);
  openTag(node, row);

  if (VOID.has(tag)) return;
  if (kids.length === 0) {
    // 자식 요소가 없으면 한 줄로: <h2>포스트 목록</h2>
    const txt = node.textContent.trim();
    if (txt && !showText) row.append(sp('t-txt', trunc(txt, 30)));
    closeTag(node, row);
    return;
  }
  kids.forEach(k => buildRows(k, depth + 1, frag));
  closeTag(node, addRow(node, depth, frag));
}

function renderTree() {
  const top = treeEl.scrollTop;
  rowMap = new Map();
  const frag = document.createDocumentFragment();
  buildRows(doc.body, 0, frag);
  treeEl.replaceChildren(frag);
  treeEl.scrollTop = top;
}

function scrollRowIntoView(node) {
  const rows = rowMap.get(node);
  if (rows && rows[0]) rows[0].scrollIntoView({ block: 'nearest' });
}

/* ════════════════════════════════════════════════════════════
   7. 강조 표시 (트리 + 화면 오버레이)
   ════════════════════════════════════════════════════════════ */
function setHover(list) {
  hovered = list.filter(Boolean);
  updateHighlights();
}

function select(el, scrollTree = true) {
  selected = el;
  win.$0 = el;
  updateHighlights();
  renderInspect();
  if (scrollTree) scrollRowIntoView(el);
}

function updateHighlights() {
  const hs = new Set(hovered), ms = new Set(matches);
  for (const [node, rows] of rowMap) {
    rows.forEach(r => {
      r.classList.toggle('is-selected', node === selected && r === rows[0]);
      r.classList.toggle('is-hover', hs.has(node));
      r.classList.toggle('is-match', ms.has(node));
    });
  }
  drawOverlays();
}

function shortName(el) {
  let s = el.tagName.toLowerCase();
  if (el.id) s += '#' + el.id;
  if (el.classList.length) s += '.' + [...el.classList].join('.');
  return s;
}

function box(el, cls, label, elapsed) {
  if (!el.isConnected || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  if (r.width === 0 && r.height === 0) return;
  const d = document.createElement('div');
  d.className = 'ov ' + cls;
  d.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`;
  if (elapsed != null) d.style.animationDelay = `-${elapsed}ms`;
  if (label) {
    const l = sp('ov-label', label);
    if (r.top < 22) l.classList.add('below');
    d.appendChild(l);
  }
  overlay.appendChild(d);
}

function drawOverlays() {
  overlay.replaceChildren();
  if (!doc) return;
  const now = performance.now();
  for (const [node, m] of marks) {
    const elapsed = now - m.t;
    if (elapsed > FLASH) { marks.delete(node); continue; }
    box(node, 'ov-flash-' + m.type, null, elapsed);
  }
  matches.forEach(el => box(el, 'ov-match'));
  if (selected) box(selected, 'ov-selected', '$0  ' + shortName(selected));
  hovered.forEach(el => {
    const r = el.getBoundingClientRect();
    box(el, 'ov-hover', hovered.length === 1 ? `${shortName(el)}  ${Math.round(r.width)} × ${Math.round(r.height)}` : null);
  });
}

/* ════════════════════════════════════════════════════════════
   8. 선택한 요소 정보
   ════════════════════════════════════════════════════════════ */
function renderInspect() {
  inspectEl.replaceChildren();
  if (!selected) {
    inspectEl.innerHTML = `<div class="empty">화면이나 트리에서 요소를 클릭하면 여기에 정보가 나오고, 에디터에서 <code>$0</code>으로 쓸 수 있어요.</div>`;
    return;
  }
  const title = document.createElement('div');
  title.className = 'ins-title';
  title.append(sp('dollar', '$0 ='), chip(selected, true));
  inspectEl.appendChild(title);

  const dl = document.createElement('dl');
  dl.className = 'ins-grid';
  const add = (k, v) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd');
    if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v);
    dl.append(dt, dd);
  };
  const txt = selected.textContent.replace(/\s+/g, ' ').trim();
  add('textContent', `"${trunc(txt, 40)}"`);
  add('classList', selected.classList.length ? `[${[...selected.classList].map(c => `'${c}'`).join(', ')}]` : '[]');
  add('children', `${selected.children.length}개`);
  add('childNodes', `${selected.childNodes.length}개`);
  add('parentElement', selected.parentElement ? chip(selected.parentElement) : 'null');
  const ds = Object.entries(selected.dataset);
  add('dataset', ds.length ? '{ ' + ds.map(([k, v]) => `${k}: "${v}"`).join(', ') + ' }' : '{}');
  inspectEl.appendChild(dl);
}

/* ════════════════════════════════════════════════════════════
   9. 선택자 실험
   ════════════════════════════════════════════════════════════ */
const selInput = $('sel-input'), selStatus = $('sel-status'), selSend = $('sel-send');

function updateMatches() {
  const v = selInput.value.trim();
  selSend.disabled = !v;
  if (!v || !doc) { matches = []; selStatus.textContent = ''; selStatus.className = 'sel-status'; return; }
  try {
    matches = [...doc.querySelectorAll(v)].filter(el => el === doc.body || doc.body.contains(el));
    selStatus.textContent = matches.length ? `${matches.length}개 일치` : '일치하는 요소 없음';
    selStatus.className = 'sel-status' + (matches.length ? ' ok' : '');
  } catch {
    matches = [];
    selStatus.textContent = '선택자 문법 오류';
    selStatus.className = 'sel-status bad';
  }
}
selInput.addEventListener('input', () => { updateMatches(); updateHighlights(); });
selSend.addEventListener('click', () => {
  const v = selInput.value.trim().replace(/'/g, "\\'");
  setCode(`document.querySelectorAll('${v}')`);
  clearActiveLesson();
  showLessonInfo({ title: '선택자 실험에서 가져온 코드', desc: '실행하면 일치하는 요소들이 결과 칸에 나옵니다.' });
  codeEl.focus();
});

/* ════════════════════════════════════════════════════════════
   10. 결과 칸 (값 표시)
   ════════════════════════════════════════════════════════════ */
function typeName(v) { return Object.prototype.toString.call(v).slice(8, -1); }

function chip(node, plain) {
  const c = document.createElement('span');
  c.className = 'chip';
  if (node.nodeType === 3) {
    c.classList.add('text-node');
    c.textContent = node.data.trim() ? `#text "${trunc(node.data.trim(), 24)}"` : '#text (줄바꿈·공백)';
  } else {
    c.append(document.createTextNode(`<${shortName(node)}>`));
    const t = node.textContent.replace(/\s+/g, ' ').trim();
    if (t && !plain && node.children.length === 0) c.append(sp('chip-text', `"${trunc(t, 24)}"`));
  }
  if (!node.isConnected) {
    c.classList.add('detached');
    c.title = '지금은 DOM에 붙어 있지 않은 노드예요';
    return c;
  }
  const el = node.nodeType === 1 ? node : node.parentElement;
  c.title = '마우스를 올리면 강조, 클릭하면 $0으로 선택';
  c.addEventListener('mouseenter', () => setHover([el]));
  c.addEventListener('mouseleave', () => setHover([]));
  c.addEventListener('click', () => select(el));
  return c;
}

function listView(label, items) {
  const wrap = document.createElement('span');
  const head = sp('list-head', `${label}(${items.length})`);
  wrap.appendChild(head);
  if (!items.length) { wrap.append(' ', sp('v-null', '[] 비어 있음')); return wrap; }
  const els = items.filter(n => n && n.nodeType && n.isConnected).map(n => n.nodeType === 1 ? n : n.parentElement);
  head.title = '마우스를 올리면 전부 강조';
  head.addEventListener('mouseenter', () => setHover(els));
  head.addEventListener('mouseleave', () => setHover([]));
  const box = document.createElement('div');
  box.className = 'list-items';
  items.slice(0, 50).forEach((n, i) => {
    const line = document.createElement('div');
    line.append(sp('idx', i), fmt(n, 1));
    box.appendChild(line);
  });
  if (items.length > 50) box.appendChild(sp('v-null', `… 외 ${items.length - 50}개`));
  wrap.appendChild(box);
  return wrap;
}

function fmt(v, depth = 0, raw = false) {
  const t = typeof v;
  if (v === undefined) return sp('v-undef', 'undefined');
  if (v === null) return sp('v-null', 'null');
  if (t === 'string') return raw ? document.createTextNode(v) : sp('v-str', JSON.stringify(v));
  if (t === 'number' || t === 'boolean' || t === 'bigint') return sp('v-num', String(v));
  if (t === 'function') return sp('v-fn', `ƒ ${v.name || '(익명 함수)'}()`);
  if (t === 'symbol') return sp('v-fn', String(v));

  if (v.nodeType === 1 || v.nodeType === 3) return chip(v);
  if (v.nodeType === 9) return sp('v-type', '#document');
  const tn = typeName(v);
  if (tn === 'NodeList' || tn === 'HTMLCollection') return listView(tn, [...v]);
  if (Array.isArray(v) && v.some(x => x && x.nodeType)) return listView('Array', v);
  if (tn === 'DOMTokenList') {
    const s = document.createElement('span');
    s.append(sp('v-type', `DOMTokenList(${v.length}) `), fmt([...v], depth + 1));
    return s;
  }
  if (depth > 2) return sp('v-type', Array.isArray(v) ? '[…]' : '{…}');

  const s = document.createElement('span');
  if (Array.isArray(v)) {
    s.append(sp('v-type', `(${v.length}) [`));
    v.slice(0, 30).forEach((x, i) => { if (i) s.append(', '); s.append(fmt(x, depth + 1)); });
    if (v.length > 30) s.append(', …');
    s.append(sp('v-type', ']'));
    return s;
  }
  let label = '';
  if (tn === 'DOMStringMap') label = 'DOMStringMap ';
  else if (/Event$/.test(tn)) label = tn + ' ';
  else if (tn !== 'Object') label = tn + ' ';
  s.append(sp('v-type', label + '{ '));
  let keys;
  if (/Event$/.test(tn)) keys = ['type', 'target', 'currentTarget'];
  else { try { keys = Object.keys(v); } catch { keys = []; } }
  keys.slice(0, 12).forEach((k, i) => {
    if (i) s.append(', ');
    s.append(sp('v-key', k), ': ', fmt(v[k], depth + 1));
  });
  if (keys.length > 12) s.append(', …');
  s.append(sp('v-type', ' }'));
  return s;
}

function addEntry(cls, ...children) {
  const e = document.createElement('div');
  e.className = 'entry ' + cls;
  e.append(...children);
  consoleEl.appendChild(e);
  while (consoleEl.children.length > 300) consoleEl.firstChild.remove();
  consoleEl.scrollTop = consoleEl.scrollHeight;
  return e;
}

function printLog(kind, args) {
  const cls = kind === 'warn' ? 'e-warn' : kind === 'error' ? 'e-error' : 'e-log';
  const parts = [];
  args.forEach((a, i) => { if (i) parts.push(' '); parts.push(fmt(a, 0, true)); });
  addEntry(cls, ...parts);
}

function hintFor(err, code) {
  const m = String((err && err.message) || err || '');
  if (/\$0/.test(code || '') && /undefined/.test(m)) return '선택된 요소가 없어요. 먼저 화면이나 트리에서 요소를 클릭해 $0을 정해 주세요.';
  if (/of null|null is not an object|on null/.test(m)) return '찾은 요소가 null이에요. 선택자 철자, #(id)와 .(class) 구분을 확인해 보세요.';
  if (/is not a function/.test(m) && /\.(map|filter|reduce|find)\b/.test(code || '')) return 'NodeList에는 map, filter 같은 배열 메서드가 없어요. [...목록]으로 배열로 바꿔서 써 보세요.';
  if (/is not a function/.test(m)) return '함수가 아닌 것을 호출했어요. 메서드 이름 철자와 대소문자를 확인해 보세요.';
  if (/is not defined/.test(m)) return '선언되지 않은 이름이에요. 철자를 확인하고, 이전 실행에서 만든 변수는 이어지지 않는다는 점도 기억하세요.';
  if (/not a valid selector/.test(m)) return 'CSS 선택자 문법이 올바르지 않아요. 따옴표와 괄호 짝을 확인해 보세요.';
  if (err && err.name === 'SyntaxError') return '자바스크립트 문법 오류예요. 괄호, 따옴표, 쉼표를 확인해 보세요.';
  return '';
}

function printError(err, fromEvent, code) {
  const name = (err && err.name) || 'Error';
  const msg = (err && err.message) || String(err);
  const head = document.createElement('pre');
  head.textContent = (fromEvent ? '[이벤트 처리 중] ' : '') + `${name}: ${msg}`;
  const hint = hintFor(err, code);
  const e = addEntry('e-error', head);
  if (hint) e.appendChild(sp('hint-line', hint));
}

function printEcho(code) {
  const pre = document.createElement('pre');
  pre.textContent = code;
  addEntry('e-echo', pre);
}

function printDiff(s, quietIfNone) {
  const total = s.added.length + s.removed.length + s.text.size + s.attrs.size;
  if (!total && quietIfNone) return;
  const e = addEntry('e-diff');
  if (!total) { e.appendChild(sp('none', 'DOM 변경 없음')); return; }
  const line = (label, cls, nodes, extra) => {
    if (!nodes.length) return;
    const l = document.createElement('div');
    l.className = 'diff-line';
    l.appendChild(sp('diff-tag ' + cls, label));
    nodes.slice(0, 8).forEach(n => {
      l.appendChild(chip(n, true));
      if (extra) { const x = extra(n); if (x) l.appendChild(sp('diff-attr', x)); }
    });
    if (nodes.length > 8) l.appendChild(sp('diff-attr', `외 ${nodes.length - 8}개`));
    e.appendChild(l);
  };
  line('+ 추가', 'add', s.added);
  line('− 제거', 'del', s.removed);
  line('~ 글자', 'chg', [...s.text]);
  line('~ 속성', 'chg', [...s.attrs.keys()], n => [...s.attrs.get(n)].join(', '));
}

/* ════════════════════════════════════════════════════════════
   11. 코드 실행
   ════════════════════════════════════════════════════════════ */
function run() {
  const code = codeEl.value;
  if (!code.trim() || !win) return;

  collect(observer.takeRecords());           // 실행 전 쌓인 변경은 따로 처리
  printEcho(code);

  let result, error = null;
  try {
    // 블록으로 감싸서 const/let이 매 실행마다 새로 시작되게 함
    result = win.eval('{\n' + code + '\n}');
  } catch (e) { error = e; }

  const summary = collect(observer.takeRecords());
  if (error) printError(error, false, code);
  else addEntry('e-result', fmt(result));
  printDiff(summary, !!error);

  renderAll();
  if (summary.added.length) scrollRowIntoView(summary.added[0]);
}

$('run-btn').addEventListener('click', run);
codeEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    const { selectionStart: a, selectionEnd: b, value } = codeEl;
    codeEl.value = value.slice(0, a) + '  ' + value.slice(b);
    codeEl.selectionStart = codeEl.selectionEnd = a + 2;
  }
});
$('clear-btn').addEventListener('click', () => consoleEl.replaceChildren());

/* ════════════════════════════════════════════════════════════
   12. 예제 목록
   ════════════════════════════════════════════════════════════ */
const lessonsEl = $('lessons'), infoEl = $('lesson-info');
let activeBtn = null;

function setCode(code) { codeEl.value = code; }
function clearActiveLesson() { if (activeBtn) activeBtn.classList.remove('active'); activeBtn = null; }
function showLessonInfo(l) {
  infoEl.innerHTML = `<h4></h4><p>${l.desc}</p>${l.try ? `<p class="try">${l.try}</p>` : ''}`;
  infoEl.querySelector('h4').textContent = l.title;
}

LESSONS.forEach((g, gi) => {
  const sec = document.createElement('div');
  sec.className = 'lesson-group';
  const h = document.createElement('h3');
  h.append(sp('', `${gi + 1}.`), g.group);
  sec.appendChild(h);
  g.items.forEach(item => {
    const b = document.createElement('button');
    b.className = 'lesson-btn';
    b.textContent = item.title;
    b.addEventListener('click', () => {
      clearActiveLesson();
      activeBtn = b; b.classList.add('active');
      setCode(item.code);
      showLessonInfo(item);
      codeEl.focus({ preventScroll: true });
    });
    sec.appendChild(b);
  });
  lessonsEl.appendChild(sec);
});

/* ════════════════════════════════════════════════════════════
   13. 기타: 텍스트 노드 토글, 초기화, 높이 조절
   ════════════════════════════════════════════════════════════ */
$('text-toggle').addEventListener('change', e => { showText = e.target.checked; renderAll(); });

$('reset-btn').addEventListener('click', () => {
  addEntry('e-sys', document.createTextNode('실습 페이지를 처음 상태로 되돌렸어요'));
  loadFrame();
});

window.addEventListener('resize', drawOverlays);
new ResizeObserver(drawOverlays).observe($('stage'));

(() => {
  const rz = $('resizer');
  let startY, startH;
  rz.addEventListener('pointerdown', e => {
    startY = e.clientY;
    startH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lab-h'));
    rz.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
  });
  rz.addEventListener('pointermove', e => {
    if (!document.body.classList.contains('dragging')) return;
    const h = Math.min(window.innerHeight - 220, Math.max(180, startH + (startY - e.clientY)));
    document.documentElement.style.setProperty('--lab-h', h + 'px');
  });
  const end = () => document.body.classList.remove('dragging');
  rz.addEventListener('pointerup', end);
  rz.addEventListener('pointercancel', end);
})();

/* ════════════════════════════════════════════════════════════
   14. 시작
   ════════════════════════════════════════════════════════════ */
addEntry('e-info', document.createTextNode('왼쪽 목록에서 예제를 고르고 실행해 보세요. 결과에 나오는 요소에 마우스를 올리면 화면과 트리에서 함께 강조됩니다.'));
lessonsEl.querySelector('.lesson-btn').click();
codeEl.blur();
loadFrame();
</script>
