<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java 중간 점검 — 상속 · 초기화 · 다형성</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12171d;
  --paper:#eceae4;
  --panel:#f7f6f2;
  --rule:#c9c5bb;
  --dim:#6d7178;
  --mark:#1f4fd8;
  --ok:#0d7a52;
  --no:#b3311f;
  --warn:#8a6a12;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-weight:400;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:0 24px 120px}

/* ---------- header ---------- */
header{border-bottom:2px solid var(--ink);padding:56px 0 20px;margin-bottom:0}
.kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin:0 0 14px
}
h1{
  font-family:var(--mono);font-weight:700;font-size:clamp(26px,4.4vw,40px);
  letter-spacing:-.02em;margin:0 0 10px;line-height:1.15
}
h1 em{font-style:normal;color:var(--mark)}
.lede{margin:0;max-width:60ch;color:var(--dim);font-size:14.5px}

/* ---------- control bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:12px 0;margin-bottom:36px
}
.bar-inner{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
  border:1px solid var(--rule);background:transparent;color:var(--dim);
  padding:5px 11px;border-radius:2px;cursor:pointer;
  transition:all .12s;white-space:nowrap
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{opacity:.55;margin-left:5px}
.meter{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px}
.track{width:120px;height:5px;background:var(--rule);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .35s cubic-bezier(.2,.7,.3,1)}
.reset{
  font-family:var(--mono);font-size:11.5px;background:none;border:0;
  color:var(--dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px
}
.reset:hover{color:var(--no)}

/* ---------- question ---------- */
.q{
  border-top:1px solid var(--rule);padding:34px 0;
  display:grid;grid-template-columns:56px 1fr;gap:0 22px
}
.q[hidden]{display:none}
.num{
  font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;
  color:var(--rule);letter-spacing:-.03em;padding-top:2px
}
.q.solved .num{color:var(--ok)}
.q.missed .num{color:var(--no)}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:12px}
.tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mark);border:1px solid currentColor;padding:2px 7px;border-radius:2px
}
.prompt{margin:0;font-size:15.5px;font-weight:500;flex:1 1 100%;white-space:pre-line}
.hint{
  font-family:var(--mono);font-size:12px;color:var(--dim);margin:8px 0 0;
  padding-left:11px;border-left:2px solid var(--rule)
}

pre{
  background:var(--ink);color:#e6e9ee;font-family:var(--mono);font-size:12.5px;
  line-height:1.6;padding:16px 18px;border-radius:3px;overflow-x:auto;margin:16px 0 0;
  tab-size:2
}
pre .k{color:#7fb0ff}pre .s{color:#8fd6a8}pre .c{color:#7b8595;font-style:italic}

ol.choices{list-style:none;counter-reset:c;padding:0;margin:16px 0 0;
  font-family:var(--mono);font-size:13px}
ol.choices li{counter-increment:c;padding:3px 0 3px 30px;position:relative}
ol.choices li::before{
  content:"(" counter(c) ")";position:absolute;left:0;color:var(--dim);font-size:12px
}

/* ---------- answer area ---------- */
.field{margin-top:18px}
.flabel{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:6px
}
input[type=text],textarea{
  width:100%;font-family:var(--mono);font-size:13.5px;line-height:1.6;
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:10px 12px;color:var(--ink);resize:vertical
}
input[type=text]:focus,textarea:focus{
  outline:none;border-color:var(--mark);box-shadow:0 0 0 3px rgba(31,79,216,.13)
}
textarea{min-height:112px}
.radios{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.radios label{
  font-family:var(--mono);font-size:13px;cursor:pointer;
  border:1px solid var(--rule);border-radius:3px;padding:7px 15px;
  background:var(--panel);transition:all .12s
}
.radios label:hover{border-color:var(--ink)}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:focus-visible+span{outline:2px solid var(--mark);outline-offset:4px}
.radios label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{
  font-family:var(--mono);font-size:12.5px;font-weight:500;
  padding:8px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);transition:opacity .12s
}
.btn:hover{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);opacity:1}

.verdict{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-left:2px}
.verdict.y{color:var(--ok)}
.verdict.n{color:var(--no)}

/* ---------- reveal ---------- */
.reveal{margin-top:18px;border-left:3px solid var(--rule);padding-left:18px}
.reveal[hidden]{display:none}
.rtitle{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 7px
}
.solution{
  font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;margin:0 0 20px;
  color:var(--ok);font-weight:500
}
.why{margin:0;font-size:14px;color:#3a4048}
.why p{margin:0 0 9px}
.why ul{margin:0 0 9px;padding-left:19px}
.why li{margin-bottom:4px}
.why code{
  font-family:var(--mono);font-size:12.5px;background:#e0ddd5;
  padding:1px 5px;border-radius:2px
}
.why .step{font-family:var(--mono);font-size:12.5px;color:var(--dim)}

/* ---------- footer / empty ---------- */
.none{
  font-family:var(--mono);font-size:13px;color:var(--dim);text-align:center;
  padding:64px 0;border-top:1px solid var(--rule)
}
.none[hidden]{display:none}
footer{
  border-top:2px solid var(--ink);margin-top:8px;padding-top:18px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px
}

@media(max-width:640px){
  .q{grid-template-columns:1fr;gap:0}
  .num{font-size:20px;margin-bottom:8px}
  .wrap{padding:0 16px 90px}
  .meter{width:100%}
  .track{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="kicker">Java · 중간 점검</p>
  <h1>상속 · 초기화 순서 · <em>다형성</em></h1>
  <p class="lede">문제마다 답을 적고 바로 채점하세요. 아직 배우지 않은 단원은 위쪽 필터에서 꺼두면 목록에서 사라집니다.</p>
</header>

<div class="bar">
  <div class="bar-inner">
    <div class="filters" id="filters"></div>
    <div class="meter">
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="score">0 / 0</span>
      <button class="reset" id="reset">전체 초기화</button>
    </div>
  </div>
</div>

<main id="list"></main>
<p class="none" id="none" hidden>표시할 문제가 없습니다. 필터를 하나 이상 켜주세요.</p>

<footer>
  <span>대소문자는 구분, 앞뒤 공백은 무시합니다.</span>
  <span>새로고침하면 답안은 지워집니다.</span>
</footer>

</div>

<script>
/* ────────────────────────────────────────────────
   채점 규칙
   set   : 콤마로 구분, 순서·공백 무관 (4·5·7번)
   lines : 줄 단위, 순서 고정 (콘솔 출력 문제)
   exact : 문자열 그대로 비교, 공백만 정규화 (6·8번)
   choice: 보기 번호
   ──────────────────────────────────────────────── */

const CATS = {
  inherit: '상속 · 오버라이딩 · 바인딩',
  init:    '초기화 순서',
  abs:     '추상클래스 · 인터페이스',
  str:     'String · 형변환',
  over:    '오버로딩'
};

const Q = [
{
 id:1, cat:'inherit',
 prompt:'다음 코드를 실행했을 때 콘솔에 출력되는 결과를 적으시오.',
 code:`class GrandParent{
\tvoid method() {
\t\tSystem.out.println("GrandParent Method");
\t}
}
class Parent extends GrandParent{
}
class Child extends Parent{
\tpublic void method() {
\t\tSystem.out.println("Child Method");
\t}
}
public class Test {
\tpublic static void main(String[] args) {
\t\tParent p = new Parent();
\t\tp.method();
\t}
}`,
 mode:'lines', answer:'GrandParent Method',
 why:`<p>Parent는 method()를 오버라이딩하지 않았으므로, 상속받은 <code>GrandParent.method()</code>가 그대로 실행됩니다.</p>
<p>Child가 method()를 재정의했지만 객체가 <code>new Parent()</code>이므로 Child와는 무관합니다.</p>`
},
{
 id:2, cat:'init',
 prompt:'다음 코드를 실행했을 때, 콘솔에 출력되는 결과를 적으시오.',
 code:`public class StaticTest {

\tString name = "A";

\t{
\t\tname = "B";
\t\tSystem.out.println("인스턴스 초기화 블록 실행");
\t}

\tstatic {
\t\tSystem.out.println("스태틱 초기화 블록 실행");
\t}

\tpublic static void main(String[] args) {
\t\tStaticTest t1 = new StaticTest();
\t\tSystem.out.println(t1.name);
\t\tStaticTest t2 = new StaticTest();
\t}
}`,
 mode:'lines',
 answer:'스태틱 초기화 블록 실행\n인스턴스 초기화 블록 실행\nB\n인스턴스 초기화 블록 실행',
 why:`<p><strong>main() 실행을 위해 StaticTest 클래스가 메모리에 로딩될 때</strong></p>
<ol class="why-ol"><li>클래스 정보가 메모리에 올라감</li><li>static 멤버 초기화</li><li>static 초기화 블록 실행</li></ol>
<p><strong>이후 main()이 호출되어 객체가 생성될 때</strong></p>
<ol><li>객체 생성 후 인스턴스 멤버 초기화 (<code>name = "A"</code>)</li><li>인스턴스 초기화 블록 실행 (<code>name = "B"</code>)</li><li>생성자 실행</li></ol>
<p>t2를 만들 때도 인스턴스 초기화 블록은 다시 실행되지만, static 블록은 클래스당 한 번뿐입니다.</p>`
},
{
 id:3, cat:'abs',
 prompt:'다음 지문 중 틀린 것을 고르시오.',
 choices:[
  '추상 클래스는 객체로 생성될 수 있다.',
  '추상 클래스엔 생성자가 존재한다.',
  '인터페이스를 사용하면 코드의 결합도가 높아진다.',
  '추상 클래스엔 abstract 메서드가 없어도 된다.'
 ],
 mode:'choice', answer:'3',
 why:`<ul>
<li>추상 클래스는 직접 객체를 생성할 순 없으나, 이를 상속한 클래스에 의해 간접적으로 객체로 생성될 수 있습니다. 이로 인해 생성자도 존재합니다.</li>
<li><strong>인터페이스의 활용은 코드의 결합도를 낮추는 효과가 있습니다.</strong> → 3번이 틀린 지문</li>
<li>추상 클래스엔 abstract 메서드가 없어도 됩니다.</li>
</ul>`
},
{
 id:4, cat:'inherit',
 prompt:'아래 코드의 참조변수 p를 통해 접근 가능한 멤버를 모두 적으시오.',
 hint:'메서드는 「클래스명.메서드명()」 형식으로 적으세요. 예) Test.main()\n답이 여러 개면 콤마(,)로 구분하며, 순서는 상관없습니다.',
 code:`class GrandParent {
\tprotected int a;
\tprivate int b;

\tprotected void method() {
\t\tSystem.out.println("GrandParent method");
\t}
}
class Parent extends GrandParent{
\tprivate int c;
\tint d;
}
class Child extends Parent{
\tprotected int e;

\tprotected void method() {
\t\tSystem.out.println("Child method");
\t}
}
public class Test {
\tpublic static void main(String[] args) {
\t\tParent p = new Child();
\t}
}`,
 mode:'set', answer:'a, GrandParent.method(), d',
 why:`<p>참조변수 p의 <strong>타입이 Parent</strong>이므로, Parent가 가진 멤버(상속받은 것 포함)까지만 접근할 수 있습니다.</p>
<ul>
<li><code>a</code> — GrandParent의 protected 필드, 상속되어 접근 가능</li>
<li><code>b</code> — private이라 상속 대상 아님 → 접근 불가</li>
<li><code>c</code> — Parent의 private 필드 → 외부에서 접근 불가</li>
<li><code>d</code> — Parent의 default 필드, 같은 패키지 → 접근 가능</li>
<li><code>e</code> — Child의 멤버, Parent 타입으로는 접근 불가</li>
<li>메서드는 <code>GrandParent.method()</code>가 선언부 기준으로 잡힙니다.</li>
</ul>`
},
{
 id:5, cat:'abs',
 prompt:'인터페이스의 변수(필드)와 메서드는 작성하지 않아도 자동으로 특정 제한자가 붙는다.\n아래 코드의 빈칸에 컴파일 시 자동으로 붙는 접근제한자와 기타 제한자를 모두 적어보시오.',
 hint:'제한자 사이는 콤마(,)로 구분하세요. 순서는 상관없습니다. 예) public, static',
 code:`public interface Test {
\t______ int NUMBER = 30;

\t______ void test();
}`,
 mode:'set',
 fields:[
  {label:'변수 (int NUMBER)', answer:'public, static, final'},
  {label:'메서드 (void test())', answer:'public, abstract'}
 ],
 why:`<ul>
<li>인터페이스는 상태(변수)를 가질 수 없기에 상수인 <code>final</code>만 가질 수 있고, 객체 없이 접근해야 하므로 <code>static</code>이 붙습니다.</li>
<li>메서드는 추상 메서드가 기본이기에 <code>abstract</code>가 생략된 것입니다.</li>
<li>인터페이스의 모든 멤버는 <code>public</code>입니다.</li>
</ul>`
},
{
 id:6, cat:'str',
 prompt:'아래 코드를 실행했을 때 콘솔에 출력되는 결과를 적으시오.',
 hint:'print()이므로 줄바꿈 없이 한 줄로 이어집니다. 출력값에 콤마가 포함되니 그대로 적어주세요.',
 code:`String str1 = "hello";
String str2 = "hello";
String str3 = new String("hello");
String str4 = new String("hello");

System.out.print(str1 == str2 + ", ");
System.out.print((str2 == str3) + ", ");
System.out.print(str2.equals(str3) + ", ");
System.out.print(str3 == str4);`,
 mode:'exact', answer:'falsefalse, true, false',
 why:`<p>첫 줄이 함정입니다. <code>str1 == str2 + ", "</code>는 연산자 우선순위에 의해 <code>+</code>가 먼저 실행되어 <code>str1 == "hello, "</code>가 되므로 <strong>false</strong>. 이때 <code>", "</code>는 비교 대상에 흡수되어 출력되지 않습니다.</p>
<ul>
<li><code>(str2 == str3)</code> → 리터럴 vs new 객체, 주소가 다르므로 <code>false, </code></li>
<li><code>str2.equals(str3)</code> → 내용 비교이므로 <code>true, </code></li>
<li><code>str3 == str4</code> → 서로 다른 new 객체이므로 <code>false</code></li>
</ul>
<p>print()라 줄바꿈이 없어 <code>false</code>와 <code>false, </code>가 붙어 <code>falsefalse, </code>로 보입니다. 낚시 문제입니다 ㅎㅎ</p>`
},
{
 id:7, cat:'over',
 prompt:'아래 코드 중 컴파일 오류가 발생하는 코드의 번호를 모두 고르시오.',
 hint:'번호를 콤마(,)로 구분해 적으세요. 순서는 상관없습니다. 이유는 채점하지 않으니 해설에서 확인하세요.',
 code:`//1
public void print(int age) {
\t\tSystem.out.println("나이");
}
//2
public void print(String name) {
\t\tSystem.out.println(name);
}
//3
public void print(String address) {
\t\tSystem.out.println("주소");
}`,
 mode:'set', answer:'2, 3',
 solutionExtra:'선언부가 일치하고 매개변수의 개수, 타입이 같으므로 같은 메서드로 처리됩니다.',
 why:`<p>오버로딩의 성립 조건은 <strong>매개변수의 개수 또는 타입이 달라야 한다</strong>는 것입니다.</p>
<ul>
<li>2번과 3번은 매개변수 이름만 다를 뿐 <code>print(String)</code>으로 선언부가 완전히 같습니다. 매개변수 이름은 시그니처에 포함되지 않으므로 중복 정의로 처리되어 컴파일 오류가 납니다.</li>
<li>1번은 <code>print(int)</code>라 타입이 달라 정상적인 오버로딩입니다.</li>
</ul>`
},
{
 id:8, cat:'inherit',

/* ── 정규화 & 채점 ── */
const squash = s => s.replace(/[ \t]+/g,' ').trim();

// 코드 답안용: 구두점 주변 공백을 없앤다.
// super( name , price ) ; / super(name,price); 모두 같은 코드로 취급.
// 단 문자열 리터럴 안의 공백은 건드리지 않는다.
function normCode(s){
  const lits = [];
  let t = s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, m => {
    lits.push(m); return '\u0000' + (lits.length-1) + '\u0000';
  });
  t = t.replace(/[ \t\r\n]+/g,' ')
       .replace(/\s*([(),;{}\[\]<>=+\-*/%!&|?:.])\s*/g,'$1')
       .trim();
  return t.replace(/\u0000(\d+)\u0000/g, (_,i) => lits[+i]);
}

function normSet(s){
  return s.split(',').map(x=>squash(x)).filter(Boolean).sort().join('\u0001');
}
function normLines(s){
  return s.replace(/\r/g,'').split('\n').map(squash).filter(Boolean).join('\n');
}
function grade(q, val, fieldIdx){
  if(q.mode==='choice') return val === q.answer;
  if(q.mode==='set'){
    const want = q.fields ? q.fields[fieldIdx].answer : q.answer;
    return normSet(val) === normSet(want);
  }
  if(q.mode==='lines') return normLines(val) === normLines(q.answer);
  if(q.mode==='code'){
    const got = normCode(val);
    if(got === normCode(q.answer)) return true;
    return (q.accept||[]).some(a => normCode(a) === got);
  }
  if(q.mode==='exact'){
    const got = squash(val);
    if(got === squash(q.answer)) return true;
    return (q.accept||[]).some(a => squash(a) === got);
  }
  return false;
}

/* ── 코드 하이라이팅(가벼운 수준) ── */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const KW = new Set(['class','public','private','protected','static','void','int','String',
  'extends','implements','new','return','this','super','final','abstract','interface',
  'for','if','else','char','boolean','double','float','long','package','import','null','true','false']);

// 한 번만 훑으면서 토큰을 분류한다. 이미 만든 태그를 다시 치환하지 않으므로
// 문자열 안의 class 같은 단어가 중복 처리되는 문제가 생기지 않는다.
function hl(code){
  let out = '', i = 0;
  while(i < code.length){
    const ch = code[i];
    if(ch === '/' && code[i+1] === '/'){                       // 한 줄 주석
      let j = code.indexOf('\n', i); if(j === -1) j = code.length;
      out += '<span class="c">' + esc(code.slice(i, j)) + '</span>'; i = j;
    } else if(ch === '"' || ch === "'"){                        // 문자열 / 문자 리터럴
      let j = i + 1;
      while(j < code.length && code[j] !== ch){ if(code[j] === '\\') j++; j++; }
      j = Math.min(j + 1, code.length);
      out += '<span class="s">' + esc(code.slice(i, j)) + '</span>'; i = j;
    } else if(/[A-Za-z_$]/.test(ch)){                           // 식별자 / 키워드
      let j = i; while(j < code.length && /[A-Za-z0-9_$]/.test(code[j])) j++;
      const w = code.slice(i, j);
      out += KW.has(w) ? '<span class="k">' + w + '</span>' : esc(w);
      i = j;
    } else {
      out += esc(ch); i++;
    }
  }
  return out;
}

    </div>`;

  const sol = (q.fields
      ? q.fields.map(f=>`${f.label} → ${f.answer}`).join('\n')
      : q.answer) + (q.solutionExtra ? '\n\n' + q.solutionExtra : '');

  body += `<div class="reveal" hidden>
      <p class="rtitle">정답</p>
      <p class="solution">${esc(sol)}</p>
      <p class="rtitle">해설</p>
      <div class="why">${q.why||'<p>—</p>'}</div>
    </div></div>`;

  sec.innerHTML = body;
  list.appendChild(sec);

  const reveal = sec.querySelector('.reveal');
  const verdict = sec.querySelector('.verdict');
  const toggle = sec.querySelector('.toggle');

  sec.querySelector('.check').addEventListener('click',()=>{
    let ok;
    if(q.mode==='choice'){
      const picked = sec.querySelector(`input[name="q${q.id}"]:checked`);
      if(!picked){ verdict.className='verdict'; verdict.textContent='보기를 선택하세요.'; return; }
      ok = grade(q, picked.value);
    } else if(q.fields){
      ok = [...sec.querySelectorAll('input[data-fi]')]
            .every(inp => grade(q, inp.value, +inp.dataset.fi));
    } else {
      ok = grade(q, sec.querySelector(`#f${q.id}`).value);
    }
    verdict.className = 'verdict ' + (ok?'y':'n');
    verdict.textContent = ok ? '정답입니다' : '다시 확인해 보세요';
    sec.classList.toggle('solved', ok);
    sec.classList.toggle('missed', !ok);
    state[q.id] = ok ? 'y' : 'n';
    if(ok && reveal.hidden){ reveal.hidden=false; toggle.textContent='해설 접기'; }
    tally();
  });

  toggle.addEventListener('click',()=>{
    reveal.hidden = !reveal.hidden;
    toggle.textContent = reveal.hidden ? '해설 보기' : '해설 접기';
  });
});

/* ── 필터 ── */
const filters = document.getElementById('filters');
Object.entries(CATS).forEach(([k,label])=>{
  const n = Q.filter(q=>q.cat===k).length;
  const b = document.createElement('button');
  b.className='chip'; b.setAttribute('aria-pressed','true'); b.dataset.cat=k;
  b.innerHTML = `${label}<span class="n">${n}</span>`;
  b.addEventListener('click',()=>{
    const on = b.getAttribute('aria-pressed')==='true';
    b.setAttribute('aria-pressed', String(!on));
    on ? active.delete(k) : active.add(k);
    apply();
  });
  filters.appendChild(b);
});

const noneEl = document.getElementById('none');
function apply(){
  let shown = 0;
  document.querySelectorAll('.q').forEach(sec=>{
    const vis = active.has(sec.dataset.cat);
    sec.hidden = !vis;
    if(vis) shown++;
  });
  noneEl.hidden = shown>0;
  tally();
}

/* ── 진행률 ── */
function tally(){
  const vis = Q.filter(q=>active.has(q.cat));
  const got = vis.filter(q=>state[q.id]==='y').length;
  document.getElementById('score').textContent = `${got} / ${vis.length}`;
  document.getElementById('fill').style.width = vis.length ? (got/vis.length*100)+'%' : '0%';
}

/* ── 초기화 ── */
document.getElementById('reset').addEventListener('click',()=>{
  document.querySelectorAll('input[type=text],textarea').forEach(el=>el.value='');
  document.querySelectorAll('input[type=radio]').forEach(el=>el.checked=false);
  document.querySelectorAll('.q').forEach(sec=>{
    sec.classList.remove('solved','missed');
    sec.querySelector('.verdict').textContent='';
    sec.querySelector('.reveal').hidden=true;
    sec.querySelector('.toggle').textContent='해설 보기';
  });
  Object.keys(state).forEach(k=>delete state[k]);
  tally();
  window.scrollTo({top:0});
});

apply();
</script>
</body>
</html>
